name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No API keys anywhere in CI: tests use fakes, and the container runs the demo provider.

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes full version tags only (no "v10")
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install (exactly what uv.lock says)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml -W error::ResourceWarning
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Console (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (build, run in demo mode, health check)
    runs-on: ubuntu-latest
    env:
      KESTREL_PROVIDERS: demo
      KESTREL_MCP: "off" # keep the check fast and offline-friendly
      KESTREL_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and start
        run: |
          # Bind mounts are created as root; let the container's non-root user write logs.
          mkdir -p logs && chmod 777 logs
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Health, auth and demo mode
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/stats)" = "401"
          curl --fail -s -H "Authorization: Bearer $KESTREL_TOKEN" http://127.0.0.1:8000/api/session | grep -q '"demo":true'
          test "$(docker compose exec -T kestrel id -u)" != "0"
          echo "healthy, token required, demo mode on, not running as root"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not just the latest
      # The gitleaks tool (MIT) from its official image, pinned. (gitleaks-action is
      # commercially licensed for organizations, so we run the tool directly.)
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

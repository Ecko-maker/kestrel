name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No API keys anywhere in CI: tests use fakes, and the container runs the demo provider.

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes full version tags only (no "v10")
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install (exactly what uv.lock says)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml -W error::ResourceWarning
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Console (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (build, run in demo mode, health check)
    runs-on: ubuntu-latest
    env:
      KESTREL_PROVIDERS: demo
      KESTREL_MCP: "off" # keep the check fast and offline-friendly
      KESTREL_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and start
        run: |
          # Bind mounts are created as root; let the container's non-root user write logs.
          mkdir -p logs && chmod 777 logs
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Health, auth and demo mode
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/stats)" = "401"
          curl --fail -s -H "Authorization: Bearer $KESTREL_TOKEN" http://127.0.0.1:8000/api/session | grep -q '"demo":true'
          test "$(docker compose exec -T kestrel id -u)" != "0"
          echo "healthy, token required, demo mode on, not running as root"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not just the latest
      # The gitleaks tool (MIT) from its official image, pinned. (gitleaks-action is
      # commercially licensed for organizations, so we run the tool directly.)
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  kestrelbench:
    name: KestrelBench (CI subset on Groq)
    needs: python # no point spending model quota on code that fails its tests
    runs-on: ubuntu-latest
    # Secrets aren't available to forks or Dependabot, so the job only runs for PRs from this
    # repository and for pushes to main (once per change, not twice per PR).
    if: >-
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KESTREL_MCP: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY secret not set; skipping KestrelBench. Add it with: gh secret set GROQ_API_KEY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the CI subset
        if: steps.key.outputs.present == 'true'
        # Gate: pass rate must not drop below the baseline minus a margin for model randomness
        # (see docs/kestrelbench.md), and model outages must stay rare.
        run: >-
          uv run kestrel bench run --subset ci --provider groq --judge groq --pause 2
          --min-pass-rate 0.75 --max-errors 2 --out evals/results/ci.json
      - name: Report
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f evals/results/ci.md ]; then cat evals/results/ci.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kestrelbench-ci
          path: evals/results/

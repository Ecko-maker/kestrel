version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Pinned to the Kaggle-tested versions until the next retrain (see distill/train_config.toml [pins]).
    # Exactly the packages the pin tests check (test_pins_match_the_lock,
    # test_notebook_pins_match_the_lock_and_call_the_script); torch isn't pinned: Kaggle's own CUDA build is used.
    ignore:
      - dependency-name: transformers
      - dependency-name: peft
      - dependency-name: trl
      - dependency-name: datasets
      - dependency-name: accelerate
      - dependency-name: bitsandbytes

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      console:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Base-image upgrades that change the runtime (node 24 -> 26, python 3.14 -> 3.15) are done
    # by hand together with CI's node-version / python-version, never as surprise PRs.
    # For python, 3.14 -> 3.15 counts as a *minor* semver bump, so minors are ignored too.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

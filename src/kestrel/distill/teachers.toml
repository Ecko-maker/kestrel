# Teachers: the only (provider, model) pairs whose outputs may become training data.
# Every model step of a trace must match one entry, or the trace is dropped.
#
# Open-weight models only (key decision 3, design decision 9): Claude, GPT and Gemini terms forbid
# training other models on their outputs, and the demo provider is scripted text, not a model.
# The loader refuses such entries, so editing this file can't let them in either.

# Exactly one entry is active: the teacher chosen under known issue #72 (distill/COLLECTION.md, step 0).

# Option a: Groq's hosted gpt-oss-120b. Inactive: used only if Groq confirms §6.3(e) in writing by
# 2026-11-04 (#72). Then uncomment these three lines and comment out option c's.
# [[teacher]]
# provider = "groq"
# model = "openai/gpt-oss-120b"

# Option c: Qwen3-30B-A3B-Instruct-2507 at Q4 (qwen3:30b-a3b-instruct-2507-q4_K_M), served by Ollama on
# Kaggle (distill/collect.ipynb) with Kestrel's template (known issue #73). Selected 10-31 by #72's
# pre-registered selection (distill/selection/); used only if Groq hasn't confirmed in writing by 2026-11-04.
# The model is the name Kestrel sends and traces record (distill/kaggle_collect.py, CANDIDATES).
[[teacher]]

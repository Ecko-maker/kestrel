# Model prices in USD per 1 million tokens, by provider and model ID.
#
#   actual_input / actual_output   what you actually pay. Free tiers = 0.
#   list_input   / list_output     the provider's public paid price for the same model, so
#                                  traces can show what a request would cost on a paid plan.
#                                  Leave them out when there's no fair reference (local models).
#
# Override this whole file with KESTREL_PRICES=path/to/prices.toml.
# A "default" entry applies to any model of that provider not listed by name.
#
# Verified 2026-10-03 against the providers' official pages (text input, standard tier):
#   Gemini: https://ai.google.dev/gemini-api/docs/pricing  (page "last updated 2026-10-01 UTC")
#   Groq:   https://console.groq.com/docs/model/openai/gpt-oss-120b
# Re-check them before quoting cost numbers; prices change.

# Kestrel's default Gemini model. Promotional price through 2026-12-31; from 2027-01-01 it
# becomes list_input = 1.50, list_output = 7.50. Update this entry then.
[gemini."gemini-3.6-flash"]
actual_input = 0.0
actual_output = 0.0
list_input = 0.75
list_output = 3.75

[gemini."gemini-3-flash-preview"]
actual_input = 0.0
actual_output = 0.0
list_input = 0.50
list_output = 3.00

[gemini."gemini-2.5-flash"]
actual_input = 0.0
actual_output = 0.0
list_input = 0.30
list_output = 2.50

[gemini."gemini-2.5-flash-lite"]
actual_input = 0.0
actual_output = 0.0
list_input = 0.10
list_output = 0.40

[gemini.default]
actual_input = 0.0
actual_output = 0.0

# Kestrel's default Groq model (and the planned distillation teacher). Cached input is $0.075.
[groq."openai/gpt-oss-120b"]
actual_input = 0.0
actual_output = 0.0
list_input = 0.15
list_output = 0.60

[groq.default]
actual_input = 0.0
actual_output = 0.0

# Local models run on your own hardware: no per-token price.
[ollama.default]
actual_input = 0.0
actual_output = 0.0

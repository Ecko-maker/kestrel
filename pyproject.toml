[project]
name = "kestrel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noah Asgodom", email = "noahasgodom01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
kestrel = "kestrel:main"
kestrel-mcp = "kestrel.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

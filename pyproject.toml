[project]
name = "kestrel"
version = "0.1.0"
description = "A personal AI agent with an approval gate, tracing and MCP, built on free tools."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Noah Asgodom", email = "noahasgodom01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "openai>=3.39.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
kestrel = "kestrel:main"
kestrel-mcp = "kestrel.mcp_server:main"

[project.optional-dependencies]
wake = [
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "pywhispercpp>=1.5.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "vosk>=0.3.45",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "playwright>=1.64.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["console"]

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, pyupgrade, bugbear, simplify, ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E741",    # `l` as a loop variable in short comprehensions reads fine here
    "RUF001",  # ambiguous unicode in strings: the box-drawing characters in trace trees are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.14"
packages = ["kestrel"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["vosk.*", "sounddevice.*", "soundfile.*", "comtypes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals/analysis/tests"]

[tool.coverage.run]
source = ["kestrel"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

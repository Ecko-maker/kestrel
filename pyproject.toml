[project]
name = "kestrel"
version = "0.1.0"
description = "A personal AI agent with an approval gate, tracing and MCP, built on free tools."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Noah Asgodom", email = "noahasgodom01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
kestrel = "kestrel:main"
kestrel-mcp = "kestrel.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "playwright>=1.63.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["console"]

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, pyupgrade, bugbear, simplify, ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E741",    # `l` as a loop variable in short comprehensions reads fine here
    "RUF001",  # ambiguous unicode in strings: the box-drawing characters in trace trees are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.14"
packages = ["kestrel"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["ddgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["kestrel"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

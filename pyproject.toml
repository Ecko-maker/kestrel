[project]
name = "kestrel"
version = "0.1.0"
description = "A personal AI agent with an approval gate, tracing and MCP, built on free tools."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Noah Asgodom", email = "noahasgodom01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
kestrel = "kestrel:main"
kestrel-mcp = "kestrel.mcp_server:main"

[project.optional-dependencies]
wake = [
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "pywhispercpp>=1.5.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "vosk>=0.3.45",
]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "trl>=1.16.0",
]
export = [
    "sentencepiece>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "playwright>=1.63.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["console"]
# These two run on Kaggle (Python 3.11/3.12), not on Kestrel's 3.14: keep their syntax 3.11-compatible (trl needs 3.11 anyway).
per-file-target-version = { "distill/train.py" = "py311", "distill/export.py" = "py311", "src/kestrel/distill/train_format.py" = "py311" }

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, pyupgrade, bugbear, simplify, ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E741",    # `l` as a loop variable in short comprehensions reads fine here
    "RUF001",  # ambiguous unicode in strings: the box-drawing characters in trace trees are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.14"
packages = ["kestrel"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["vosk.*", "sounddevice.*", "soundfile.*", "comtypes.*"]
ignore_missing_imports = true

# The optional `train` extra (torch, transformers, ...) is not installed in CI.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "trl.*", "datasets.*", "accelerate.*", "bitsandbytes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals/analysis/tests"]

[tool.coverage.run]
source = ["kestrel"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

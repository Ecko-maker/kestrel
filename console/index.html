<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/kestrel.svg" />
    <title>Kestrel</title>
    <script>
      // Apply the saved look and theme before first paint, so there's no flash of the wrong one.
      // Storage can be blocked (private windows, blocked site data): fall back to classic / system.
      (function () {
        var t = "system", look = "classic";
        try {
          t = localStorage.getItem("kestrel-theme") || "system";
          look = localStorage.getItem("kestrel-look") === "hud" ? "hud" : "classic";
        } catch (e) {}
        var dark = look === "hud" || t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.look = look;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
